<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome BDCC | TP2 CI/CD</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top right, #176b87, transparent 38%), #071521; color: #eef7fa; }
    main { width: min(860px, calc(100% - 40px)); padding: 56px; border: 1px solid #36738c; border-radius: 24px; background: rgba(8,31,43,.84); box-shadow: 0 24px 65px rgba(0,0,0,.34); }
    .tag { display:inline-block; padding:7px 12px; border-radius:999px; background:#0d8b94; font-weight:700; letter-spacing:.05em; }
    h1 { font-size:clamp(3rem,10vw,6rem); margin:24px 0 12px; letter-spacing:-.06em; }
    p { font-size:1.2rem; color:#c4dce3; line-height:1.65; }
    .card { margin-top:32px; padding:22px; border-left:4px solid #f4b942; background:#0b2533; }
    .version { font-weight:800; color:#f4d17b; }
    footer { margin-top:38px; color:#8db5c3; }
  </style>
</head>
<body>
  <main>
    <span class="tag">TP2 - Docker, Jenkins &amp; CI/CD</span>
    <h1>Welcome BDCC</h1>
    <p>Application Nginx conteneurisée et livrée par une chaîne CI/CD.</p>
    <section class="card" aria-label="Information de déploiement">
      <div class="version">Version 1.0 - Initial Docker Build</div>
      <div>Réalisé par : <strong>Abdelali Saadali</strong></div>
    </section>
    <footer>ENSET Mohammedia - UH2C · Année universitaire 2026/2027</footer>
  </main>
</body>
</html>
